name: STVV Adobe-free Fixture Draft Artwork
on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"  # 09:20 JST, review-only; no publication
  pull_request:
    paths:
      - 'fixture_draft_art.py'
      - 'tests/test_fixture_draft_art.py'
      - '.github/workflows/fixture-draft-art.yml'
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow requests beautifulsoup4
      - name: Validate draft generator without network
        run: python -m unittest tests.test_fixture_draft_art -v
      - name: Fetch official fixture evidence and create unapproved preview
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python fixture_watch.py
          python fixture_draft_art.py
      - name: Upload three concepts and contact sheet for editorial review, never publish
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: fixture-draft-preview-${{ github.run_id }}
          path: |
            generated/fixture_draft_preview*.png
            reports/fixture-draft-preview.json
            reports/fixture-watch-latest.json
          if-no-files-found: warn
          retention-days: 14
