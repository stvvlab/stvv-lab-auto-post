name: Normalize approved De Meyer image upload

on:
  push:
    branches:
      - fix/de-meyer-exact-image-transfer-20261104
    paths:
      - "generated/**"

permissions:
  contents: write

concurrency:
  group: de-meyer-image-normalize
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependency
        run: python -m pip install pillow
      - name: Verify and normalize only the exact original bytes
        run: python scripts/normalize_de_meyer_upload.py
      - name: Commit verified rename to this upload branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A generated/
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize approved De Meyer PNG upload filename'
            git push origin HEAD:fix/de-meyer-exact-image-transfer-20261104
          fi
