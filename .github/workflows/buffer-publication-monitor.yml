name: Read-only Buffer publication monitor

on:
  schedule:
    # Daily 18:20 and 19:00 JST. GitHub schedule can run late.
    - cron: '20 9 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buffer-publication-monitor
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime dependencies
        run: python -m pip install requests pillow
      - name: Run read-only classification tests
        run: python -m unittest tests.test_buffer_publication_monitor
      - name: Inspect remote Buffer status without mutation
        id: probe
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: python -m scripts.buffer_publication_monitor
      - name: Upload the evidence even if remote status failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffer-publication-monitor-${{ github.run_id }}
          path: reports/buffer-publication-monitor.json
          if-no-files-found: warn
      - name: Report actual monitoring errors
        if: steps.probe.outcome == 'failure'
        run: |
          echo "Buffer status needs attention; no resend attempted." >> "$GITHUB_STEP_SUMMARY"
          exit 1
