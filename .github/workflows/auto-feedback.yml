name: STVV LAB Auto Feedback

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # 03:00 JST

permissions:
  contents: write

concurrency:
  group: stvv-auto-feedback
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install requests
      - name: Collect feedback
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python auto_feedback.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feedback.json
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then
            echo "No feedback changes"
          else
            git commit -m "Update STVV LAB automatic feedback"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
