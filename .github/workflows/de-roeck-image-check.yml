              print(name, 'status=',code,'type=',typ,'bytes=',len(data),'png=',data.startswith(bytes.fromhex('89504e470d0a1a0a')),'sha_match=',hashlib.sha256(data).hexdigest()==expected,'redirect_host=',urllib.parse.urlparse(final).hostname)
