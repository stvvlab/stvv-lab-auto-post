name: STVV Reconcile Existing Pending Reservation Without Resend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-existing-reservation.yml'

permissions:
  contents: write

concurrency:
  group: stvv-auto-post
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Test identity checks before any ledger reconciliation
        run: python -m unittest tests.test_advance_reservations tests.test_reserve_on_approval -v
      - name: Reconcile remote Buffer reservation by unique caption time and immutable image source
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python reconcile_existing_reservation.py
      - name: Preserve recovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reservation-recovery-${{ github.run_id }}
          path: reports/pending-reservation-recovery-latest.json
          if-no-files-found: warn
      - name: Save sanitized recovery report
        if: always()
        run: |
          if [ -f reports/pending-reservation-recovery-latest.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/pending-reservation-recovery-latest.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record existing Buffer reservation reconciliation'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
