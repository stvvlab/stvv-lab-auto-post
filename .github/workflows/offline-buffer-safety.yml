name: Offline Buffer reservation safety tests
on:
  push:
    branches: [main]
    paths:
      - tests/test_reusable_queue_safety.py
      - editorial/manual_reservation/enqueue_approved.py
      - .github/workflows/offline-buffer-safety.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Test approval, image integrity, path guard and duplicate drafts (offline)
        run: python -m unittest tests.test_reusable_queue_safety -v
