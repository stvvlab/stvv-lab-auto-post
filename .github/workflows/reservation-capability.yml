name: Buffer Reservation Read-Only Capability

on:
  push:
    paths:
      - 'buffer_reservations.py'
      - '.github/workflows/reservation-capability.yml'

permissions:
  contents: write

concurrency:
  group: stvv-reservation-capability
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Read account permission, queue capacity and existing post status only
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python buffer_reservations.py
      - name: Preserve capability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reservation-capability-${{ github.run_id }}
          path: reports/reservation-capability.json
          retention-days: 30
      - name: Save measured capability on main only
        if: always() && github.ref == 'refs/heads/main'
        run: |
          if [ -f reports/reservation-capability.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/reservation-capability.json
            if ! git diff --cached --quiet; then
              git commit -m "Record read-only Buffer reservation capability"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
