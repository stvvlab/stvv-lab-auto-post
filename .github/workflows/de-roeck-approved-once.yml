name: Approved De Roeck announcement - one-time queue
on:
  push:
    branches: [main]
    paths:
      - editorial/reservation_requests/2026-11-10_de_roeck_approved.json
permissions:
  contents: write
concurrency:
  group: buffer-approved-queue
  cancel-in-progress: false
jobs:
  import-and-queue:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Register exact approved PNG
        env:
          REQUEST_PATH: editorial/reservation_requests/2026-11-10_de_roeck_approved.json
        run: |
          python - <<'PY'
          import json,requests,hashlib,pathlib,os
          req=json.loads(pathlib.Path(os.environ['REQUEST_PATH']).read_text())
          if req.get('approval_status')!='approved': raise SystemExit('Not approved')
          url=req['image_public_url']
          if not url.startswith('https://'): raise SystemExit('Not HTTPS')
          response=requests.get(url,timeout=30)
          response.raise_for_status()
          data=response.content
          if not data.startswith(bytes.fromhex('89504e470d0a1a0a')): raise SystemExit('Not PNG')
          if hashlib.sha256(data).hexdigest()!=req['image_sha256']: raise SystemExit('Image mismatch')
          dest=pathlib.Path('generated/2026-11-10_de_roeck_approved.png')
          if dest.exists() and dest.read_bytes()!=data: raise SystemExit('Different existing image')
          dest.parent.mkdir(exist_ok=True)
          dest.write_bytes(data)
          print('APPROVED_IMAGE_VERIFIED')
          PY
      - name: Commit verified image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/2026-11-10_de_roeck_approved.png
          git diff --cached --quiet || (git commit -m 'Register approved De Roeck image' && git push)
      - name: Enqueue approved Buffer post once
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          REQUEST_PATH: editorial/reservation_requests/2026-11-10_de_roeck_approved.json
        run: python -m editorial.manual_reservation.enqueue_approved
