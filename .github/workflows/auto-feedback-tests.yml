name: STVV Feedback Safety Tests

on:
  pull_request:
    paths:
      - 'auto_feedback.py'
      - 'tests/**'
      - '.github/workflows/auto-feedback-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s tests -v
