name: STVV Feedback Safety Tests

on:
  push:
    branches: [main]
    paths:
      - 'auto_feedback.py'
      - 'content_card.py'
      - 'prepared_media.py'
      - 'editorial/imagegen_cards.json'
      - 'stvv_post.py'
      - 'text_metrics.py'
      - 'design_brief.py'
      - 'preparation_inventory.py'
      - 'quality_gate.py'
      - 'test_quality_gate.py'
      - 'test_preflight_post.py'
      - 'style_posts.py'
      - 'content_guard.py'
      - 'official_match_data.py'
      - 'editorial/official_match_facts.json'
      - 'editorial/verified_news_heading.json'
      - 'assets/**'
      - 'render_stadium_preview.py'
      - 'scripts/install-card-font.sh'
      - '.github/workflows/main.yml'
      - 'tests/**'
      - '.github/workflows/auto-feedback-tests.yml'
  pull_request:
    paths:
      - 'auto_feedback.py'
      - 'content_card.py'
      - 'prepared_media.py'
      - 'editorial/imagegen_cards.json'
      - 'stvv_post.py'
      - 'text_metrics.py'
      - 'design_brief.py'
      - 'preparation_inventory.py'
      - 'quality_gate.py'
      - 'test_quality_gate.py'
      - 'test_preflight_post.py'
      - 'style_posts.py'
      - 'content_guard.py'
      - 'official_match_data.py'
      - 'editorial/official_match_facts.json'
      - 'editorial/verified_news_heading.json'
      - 'discovery_brief.py'
      - 'scripts/install-card-font.sh'
      - '.github/workflows/main.yml'
      - 'tests/**'
      - '.github/workflows/auto-feedback-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Restore Japanese font cache
        uses: actions/cache@v4
        with:
          path: .cache/stvv-fonts
          key: ${{ runner.os }}-noto-cjk-bold-v1-${{ hashFiles('scripts/install-card-font.sh') }}
      - name: Install Japanese font for previews
        timeout-minutes: 5
        run: bash scripts/install-card-font.sh
      - run: python -m unittest discover -s tests -v
      - run: python render_stadium_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: automatic-stadium-preview
          path: |
            generated/auto_stadium_preview.jpg
            generated/auto_stadium_preview.layout.json
            generated/scorer_alignment_preview.jpg
            generated/scorer_alignment_preview.layout.json
            generated/scorer_split_preview.*
            generated/scorer_poster_preview.*
            generated/news_heading_preview.jpg
            generated/news_heading_preview.layout.json
            generated/vote_candidate_preview.jpg
            generated/vote_candidate_preview.layout.json
            generated/player_official_preview.jpg
            generated/player_official_preview.layout.json
            generated/variant_*_preview.jpg
            generated/variant_*_preview.layout.json
            generated/composition_variants_preview.jpg
