name: STVV Feedback Safety Tests

on:
  push:
    branches: [main]
    paths:
      - 'content_card.py'
      - 'stvv_post.py'
      - 'content_guard.py'
      - 'official_match_data.py'
      - 'editorial/official_match_facts.json'
      - 'assets/**'
      - 'render_stadium_preview.py'
      - 'tests/**'
      - '.github/workflows/auto-feedback-tests.yml'
  pull_request:
    paths:
      - 'auto_feedback.py'
      - 'content_card.py'
      - 'stvv_post.py'
      - 'content_guard.py'
      - 'official_match_data.py'
      - 'editorial/official_match_facts.json'
      - 'discovery_brief.py'
      - 'tests/**'
      - '.github/workflows/auto-feedback-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -v
      - run: python render_stadium_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: automatic-stadium-preview
          path: |
            generated/auto_stadium_preview.jpg
            generated/auto_stadium_preview.layout.json
