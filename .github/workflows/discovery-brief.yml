name: STVV LAB Discovery Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *" # JST 07:30

permissions:
  contents: write

concurrency:
  group: stvv-discovery-brief
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build discovery brief
        run: python discovery_brief.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/discovery-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update STVV discovery brief"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
