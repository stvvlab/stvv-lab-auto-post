name: STVV LAB Discovery Brief

on:
  workflow_dispatch:
  pull_request:
    paths: ['official_sources.py', 'preparation_inventory.py', 'editorial_research.py', 'editorial_novelty.py', 'tests/test_editorial_research.py', 'fixture_schedule_inventory.py', 'tests/test_fixture_schedule_inventory.py', 'stvv_post.py', 'tests/test_preparation_inventory.py', 'tests/test_news_articles.py', 'simple_post_drafts.py', 'tests/test_simple_post_drafts.py', '.github/workflows/discovery-brief.yml']
  schedule:
    - cron: "30 22 * * *" # JST 07:30
    - cron: "40 * * * *" # Read-only candidate preparation, hourly; never publishes

permissions:
  contents: write

concurrency:
  group: stvv-discovery-brief
  cancel-in-progress: false

jobs:
  discovery:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build discovery brief
        run: python discovery_brief.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/discovery-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update STVV discovery brief"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  inventory-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python -m unittest tests.test_news_articles tests.test_preparation_inventory tests.test_editorial_research tests.test_fixture_schedule_inventory tests.test_simple_post_drafts -v
      - name: Live official fixture parser smoke (read-only; no approval or publishing)
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime
          import requests
          from fixture_schedule_inventory import JST, parse_fixtures, schedule_url
          now = datetime.now(JST)
          response = requests.get(schedule_url(now), timeout=20)
          response.raise_for_status()
          fixtures = parse_fixtures(response.text, now)
          print("LIVE_FIXTURE_PARSE_OK", [(x["opponent"], x["kickoff_jst"]) for x in fixtures])
          PY

  preparation:
    needs: inventory-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Collect unpublished official source evidence without publishing
        run: python preparation_inventory.py
      - name: Prepare short official headline drafts without approval or publishing
        if: always()
        run: |
          if [ -f reports/preparation-latest.json ]; then
            python simple_post_drafts.py
          fi
      - name: Collect unused evidence for editorial review without publishing
        if: always()
        run: python editorial_research.py
      - name: Collect official upcoming fixture evidence without publishing
        if: always()
        continue-on-error: true
        run: python fixture_schedule_inventory.py
      - name: Surface publishing supply blockers
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          inventory = Path("reports/preparation-latest.json")
          research = Path("reports/editorial-research-latest.json")
          fixtures = Path("reports/fixture-schedule-latest.json")
          manifest = Path("editorial/imagegen_cards.json")
          lines = ["## STVV LAB publishing supply", ""]
          if not inventory.exists():
              lines.append("- Official source inventory unavailable; review preparation job failure.")
          else:
              try:
                  report = json.loads(inventory.read_text(encoding="utf-8"))
                  cards = json.loads(manifest.read_text(encoding="utf-8")).get("cards", [])
                  ready = sum(c.get("status") == "ready" and c.get("reviewed") is True for c in cards)
                  candidates = report.get("candidates", [])
                  lines += [
                      f"- Source scan: {report.get('status', 'unknown')}",
                      f"- Reviewed ready images: **{ready}**",
                      f"- Source candidates awaiting processing: **{len(candidates)}**",
                  ]
                  if ready == 0:
                      lines.append("- **BLOCKER:** No reviewed image is ready for future scheduled publishing.")
                      lines.append("- Required: verify official body, draft accurate text, create image, visually review, then register immutable approved media.")
                  if candidates:
                      lines.append("- Candidate sources (review required; not publish approval):")
                      for item in candidates[:5]:
                          lines.append(f"  - {item.get('source_url', 'unknown')} ({item.get('status', 'unknown')})")
                  elif report.get("status") == "no_unposted_candidate_in_scanned_lists":
                      lines.append("- No unpublished source in the scanned official lists; don't generate fabricated posts to fill slots.")
              except (ValueError, OSError, TypeError) as error:
                  lines.append(f"- Evidence unreadable ({type(error).__name__}); check artifacts.")
          lines.append(f"- Editorial research report: {'available' if research.exists() else 'missing'}")
          if fixtures.exists():
              try:
                  future = json.loads(fixtures.read_text(encoding="utf-8"))
                  lines.append(f"- Upcoming fixture evidence (not approved): {len(future.get('candidates', []))}")
              except (ValueError, OSError):
                  lines.append("- Upcoming fixture evidence unreadable; review preparation logs.")
          else:
              lines.append("- Upcoming fixture evidence unavailable; check fixture preparation step.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Keep evidence even when source retrieval fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preparation-${{ github.run_id }}
          path: |
            reports/preparation-latest.json
            reports/simple-post-drafts.json
            reports/editorial-research-latest.json
            reports/fixture-schedule-latest.json
          retention-days: 14
      - name: Save latest preparation evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/preparation-latest.json reports/editorial-research-latest.json
          if [ -f reports/simple-post-drafts.json ]; then
            git add reports/simple-post-drafts.json
          fi
          if [ -f reports/fixture-schedule-latest.json ]; then
            git add reports/fixture-schedule-latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update official source preparation inventory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
