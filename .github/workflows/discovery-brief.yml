name: STVV LAB Discovery Brief

on:
  workflow_dispatch:
  pull_request:
    paths: ['official_sources.py', 'preparation_inventory.py', 'editorial_research.py', 'tests/test_editorial_research.py', 'stvv_post.py', 'tests/test_preparation_inventory.py', 'tests/test_news_articles.py', '.github/workflows/discovery-brief.yml']
  schedule:
    - cron: "30 22 * * *" # JST 07:30
    - cron: "40 * * * *" # Read-only candidate preparation, hourly; never publishes

permissions:
  contents: write

concurrency:
  group: stvv-discovery-brief
  cancel-in-progress: false

jobs:
  discovery:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build discovery brief
        run: python discovery_brief.py
      - name: Save report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/discovery-latest.md
          if ! git diff --cached --quiet; then
            git commit -m "Update STVV discovery brief"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

  inventory-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python -m unittest tests.test_news_articles tests.test_preparation_inventory tests.test_editorial_research -v

  preparation:
    needs: inventory-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Collect unpublished official source evidence without publishing
        run: python preparation_inventory.py
      - name: Collect unused evidence for editorial review without publishing
        if: always()
        run: python editorial_research.py
      - name: Keep evidence even when source retrieval fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preparation-${{ github.run_id }}
          path: |
            reports/preparation-latest.json
            reports/editorial-research-latest.json
          retention-days: 14
      - name: Save latest preparation evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/preparation-latest.json reports/editorial-research-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official source preparation inventory"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
