name: STVV official discovery live probe (read-only)

on:
  push:
    branches:
      - fix/recognize-goal-draw-headlines-20261123
    paths:
      - official_sources.py
      - scripts/probe_live_official_discovery.py
      - .github/workflows/official-discovery-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Read official news lists and assert match article extraction
        run: python -m scripts.probe_live_official_discovery
