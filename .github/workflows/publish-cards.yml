name: STVV LAB Publish Safe Cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-cards.yml"
      - "generate_social_cards.py"

permissions:
  contents: write

concurrency:
  group: stvv-publish-cards
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow requests
      - name: Create safe, topic-specific cards
        run: python generate_social_cards.py
      - name: Commit cards to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/player_lab.png generated/topic_*.png
          if git diff --cached --quiet; then
            echo "All cards already published"
          else
            git commit -m "Publish STVV LAB safe editorial cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify public PNG bytes without posting
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          import time
          import requests

          rev = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          names = [Path("generated/player_lab.png")] + sorted(Path("generated").glob("topic_*.png"))
          assert len(names) == 7, f"Expected 7 cards, got {len(names)}"
          for path in names:
              local = path.read_bytes()
              assert local.startswith(b"\x89PNG\r\n\x1a\n"), path
              url = f"https://raw.githubusercontent.com/stvvlab/stvv-lab-auto-post/{rev}/{path.as_posix()}"
              verified = False
              for attempt in range(4):
                  try:
                      response = requests.get(url, timeout=15)
                      response.raise_for_status()
                      verified = hashlib.sha256(response.content).digest() == hashlib.sha256(local).digest()
                      if verified:
                          break
                  except requests.RequestException:
                      pass
                  time.sleep(3)
              if not verified:
                  raise RuntimeError(f"Public card not yet available: {path}")
              print(f"VERIFIED_PUBLIC_CARD: {path} (no X post sent)")
          PY
