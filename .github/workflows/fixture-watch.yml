name: STVV Fixture Time Cross-check

on:
  workflow_dispatch:
  schedule:
    - cron: "20 2 * * *"
  pull_request:
    paths:
      - "fixture_watch.py"
      - "tests/test_fixture_watch.py"
      - ".github/workflows/fixture-watch.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Verify fixture conflict safety without network
        run: python -m unittest tests.test_fixture_watch -v
      - name: Compare official club fixtures (read-only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python fixture_watch.py
      - name: Keep conflict evidence as an artifact
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: fixture-time-crosscheck-${{ github.run_id }}
          path: reports/fixture-watch-latest.json
          if-no-files-found: warn
          retention-days: 14
