name: Enqueue one approved De Meyer post (keep Draft)
on:
  push:
    branches: [fix/de-meyer-exact-image-transfer-20261104]
    paths: ['editorial/manual_reservation/de_meyer_queue_trigger.json']
permissions:
  contents: read
concurrency:
  group: de-meyer-one-queue
  cancel-in-progress: false
jobs:
  enqueue_once:
    if: github.actor != 'github-actions[bot]' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Add only one verified queued post; never publish immediately
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          STVV_SINGLE_QUEUE_APPROVED: APPROVE_ONE_DE_MEYER_QUEUE
        run: python -m editorial.manual_reservation.enqueue_de_meyer_once
      - name: Preserve resulting queue receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de-meyer-buffer-queue-receipt
          path: editorial/manual_reservation/de_meyer_queue_ledger.json
          retention-days: 14
