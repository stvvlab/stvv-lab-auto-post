name: Visual pipeline checks

on:
  pull_request:
    paths:
      - 'reservation_preview.py'
      - 'visual_rotation.py'
      - 'ai_art.py'
      - 'content_card.py'
      - 'stvv_post.py'
      - 'official_sources.py'
      - 'text_metrics.py'
      - 'design_brief.py'
      - 'quality_gate.py'
      - 'tests/test_quality_gate.py'
      - 'tests/test_preflight_post.py'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - name: Restore Japanese font cache
        uses: actions/cache@v4
        with:
          path: .cache/stvv-fonts
          key: ${{ runner.os }}-noto-cjk-bold-v1-${{ hashFiles('scripts/install-card-font.sh') }}
      - name: Install Japanese font for visual checks
        timeout-minutes: 5
        run: bash scripts/install-card-font.sh
      - run: python -m compileall -q ai_art.py visual_rotation.py content_card.py stvv_post.py
      - run: python -m unittest discover -s tests -v
