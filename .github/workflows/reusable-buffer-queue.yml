name: Reusable approved Buffer queue
on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Approved editorial request JSON path
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: buffer-approved-queue
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pillow
      - name: Validate approved request and enqueue
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          REQUEST_PATH: ${{ inputs.request_path }}
        run: python -m editorial.manual_reservation.enqueue_approved
