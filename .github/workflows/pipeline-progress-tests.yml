name: Pipeline progress regression tests

on:
  pull_request:
    paths:
      - 'editorial/pipeline_progress.py'
      - 'tests/test_pipeline_progress.py'
      - '.github/workflows/pipeline-progress-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated read-only regression tests
        run: python -m unittest discover -s tests -p 'test_pipeline_progress.py' -v
