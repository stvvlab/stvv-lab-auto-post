name: Reserve approved STVV victory post once
on:
  push:
    branches: [main]
    paths: [editorial/reservation_requests/2026-11-11_zulte_win_approved.json]
permissions:
  contents: write
jobs:
  reserve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install pillow requests beautifulsoup4
      - name: Generate approved concept as PNG in GitHub
        run: python editorial/manual_reservation/draw_zulte_win.py
      - name: Commit image before Buffer reservation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/2026-11-09_zulte_4_1_japanese_three.png
          git diff --cached --quiet || (git commit -m "Add STVV victory match graphic" && git push)
      - name: Reserve only if no matching existing Buffer post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          python - <<'PY'
          from buffer_reservations import BufferReservations
          from stvv_post import CHANNEL
          c=BufferReservations()
          caption='''🇯🇵🔥 日本人3選手がゴール！
          
          🇧🇪 STVVがズルテ・ワレヘムに4-1で快勝！
          
          ⚽ 新川志音｜先制ゴール
          ⚽ 石渡ネルソン｜追加点
          ⚽ セヴァウィ｜PK成功
          ⚽ 松澤海斗｜途中出場からゴール
          
          新監督デ・ロックの初陣で、リーグ戦6試合ぶりの勝利！💛
          
          💬 この試合、最も印象に残った選手は？
          
          #STVV #シントトロイデン'''
          url='https://raw.githubusercontent.com/stvvlab/stvv-lab-auto-post/main/generated/2026-11-09_zulte_4_1_japanese_three.png'
          snapshot=c.preflight()
          same=[p for p in snapshot['posts'] if p.get('channelId')==CHANNEL and p.get('text')==caption]
          if same:
            print('EXISTING_MATCH',[(p['id'],p['status']) for p in same])
            raise SystemExit(0)
          import requests
          image=requests.get(url,timeout=25);image.raise_for_status()
          if not image.content.startswith(bytes.fromhex('89504e470d0a1a0a')): raise RuntimeError('Public image not PNG')
          p=c.schedule(caption,url,'2026-11-11T03:30:00.000Z')
          q=c.get_post(p['id'])
          print('RESERVATION',{'id':q['id'],'status':q['status'],'dueAt':q['dueAt'],'image':q.get('assets',[{}])[0].get('source'),'same_text':q['text']==caption})
          if q['status']!='scheduled' or q['dueAt']!='2026-11-11T03:30:00.000Z' or q['text']!=caption or not q.get('assets') or q['assets'][0]['source']!=url: raise RuntimeError('Reservation verification failed')
          PY
