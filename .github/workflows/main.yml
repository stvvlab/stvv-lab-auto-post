
name: STVV Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"   # JST 08:00
    - cron: "0 9 * * *"    # JST 18:00
    - cron: "0 14 * * *"   # JST 23:00

permissions:
  contents: write

concurrency:
  group: stvv-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 pillow

      - name: Restore Japanese font cache
        uses: actions/cache@v4
        with:
          path: .cache/stvv-fonts
          key: ${{ runner.os }}-noto-cjk-bold-v1-${{ hashFiles('scripts/install-card-font.sh') }}

      - name: Install Japanese font for content cards
        timeout-minutes: 5
        run: bash scripts/install-card-font.sh

      # Full test suite runs in pull-request CI. Keep only publication-critical
      # smoke tests on the three scheduled runs to avoid unrelated test failures
      # blocking otherwise verified, reviewed posts.
      - name: Run publication safety smoke tests
        run: |
          python -m unittest -q \
            tests.test_quality_gate \
            tests.test_preflight_post \
            tests.test_quality_integration \
            tests.test_prepared_media \
            tests.test_advance_reservations \
            tests.test_delivery_run \
            tests.test_state_sync \
            tests.test_posting_policy \
            tests.test_content_guard \
            tests.test_editorial_repeat_policy \
            tests.test_editorial_novelty

      - name: Run STVV auto post
        if: github.event_name == 'schedule'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          STVV_AI_ART_ENABLED: "false"  # Built-in imagegen preparation only; no paid API
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
          STVV_DELIVERY_RECORD: "true"
          STVV_ADVANCE_RESERVATIONS: "true" # Future existing slots; never shareNow
        run: python delivery_run.py

      - name: Preserve actual delivery evidence even after a send error
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: delivery-${{ github.run_id }}
          path: reports/delivery-runs/${{ github.run_id }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save actual run outcome without modifying publication history
        if: always() && github.event_name == 'schedule'
        env:
          DELIVERY_RUN_ID: ${{ github.run_id }}
        run: |
          report="reports/delivery-runs/${DELIVERY_RUN_ID}.json"
          if [ -f "$report" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$report" reports/delivery-latest.json
            if ! git diff --cached --quiet; then
              git commit -m "Record actual scheduled delivery outcome"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
