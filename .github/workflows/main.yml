name: STVV Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 pillow

      - name: Generate MATCH LAB image
        run: python generate_image.py

      - name: Run STVV auto post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python stvv_post.py
