
name: STVV Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"   # JST 08:00
    - cron: "30 1 * * *"   # JST 10:30
    - cron: "30 3 * * *"   # JST 12:30
    - cron: "30 6 * * *"   # JST 15:30
    - cron: "0 9 * * *"    # JST 18:00
    - cron: "0 12 * * *"   # JST 21:00
    - cron: "0 14 * * *"   # JST 23:00

permissions:
  contents: write

concurrency:
  group: stvv-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 pillow

      - name: Generate STVV LAB image
        continue-on-error: true
        run: python generate_image.py

      - name: Generate portrait-free PLAYER LAB image
        run: python generate_social_cards.py

      - name: Save generated image to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- generated/
          if git diff --cached --quiet; then
            echo "No changes to generated cards"
          else
            git commit -m "Update STVV LAB editorial cards"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Run STVV auto post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: python stvv_post.py
