
name: STVV Auto Post

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"   # JST 08:00
    - cron: "30 1 * * *"   # JST 10:30
    - cron: "30 3 * * *"   # JST 12:30
    - cron: "30 6 * * *"   # JST 15:30
    - cron: "0 9 * * *"    # JST 18:00
    - cron: "0 12 * * *"   # JST 21:00
    - cron: "0 14 * * *"   # JST 23:00

permissions:
  contents: write

concurrency:
  group: stvv-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 pillow

      - name: Restore Japanese font cache
        uses: actions/cache@v4
        with:
          path: .cache/stvv-fonts
          key: ${{ runner.os }}-noto-cjk-bold-v1-${{ hashFiles('scripts/install-card-font.sh') }}

      - name: Install Japanese font for content cards
        timeout-minutes: 5
        run: bash scripts/install-card-font.sh

      - name: Test adopted renderer and posting safety
        run: python -m unittest discover -s tests -v

      - name: Run STVV auto post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STVV_AI_ART_ENABLED: ${{ vars.STVV_AI_ART_ENABLED == 'true' && secrets.OPENAI_API_KEY != '' }}
          STVV_IMAGE_MODEL: gpt-image-2.5-flare
          STVV_IMAGE_QUALITY: medium
          GITHUB_SCHEDULE: ${{ github.event.schedule }}
        run: python stvv_post.py
