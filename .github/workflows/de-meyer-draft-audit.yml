name: Read-only audit of uncertain De Meyer Buffer Draft
on:
  push:
    branches:
      - fix/de-meyer-exact-image-transfer-20261104
    paths:
      - 'editorial/manual_reservation/de_meyer_draft_audit_request.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only API dependencies
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Read existing Buffer posts without mutations
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m scripts.audit_de_meyer_draft
