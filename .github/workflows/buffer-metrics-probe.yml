name: Buffer Metrics Read-Only Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"  # 12:15 JST; measurement only, no new posting slot
  pull_request:
    paths:
      - "buffer_metrics_probe.py"
      - "tests/test_buffer_metrics_probe.py"
      - ".github/workflows/buffer-metrics-probe.yml"
  push:
    paths:
      - "buffer_metrics_probe.py"
      - "tests/test_buffer_metrics_probe.py"
      - ".github/workflows/buffer-metrics-probe.yml"

permissions:
  contents: read

concurrency:
  group: stvv-buffer-metrics-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Test read-only metrics collection without API access
        run: python -m unittest tests.test_buffer_metrics_probe -v
      - name: Read metrics of at most five existing sent posts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python buffer_metrics_probe.py
      - name: Preserve metrics evidence without mutating post history
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: buffer-metrics-${{ github.run_id }}
          path: reports/buffer-metrics-latest.json
          if-no-files-found: warn
          retention-days: 90
